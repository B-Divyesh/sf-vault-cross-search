[package]
name = "vault-cross-search"
version = "0.1.2"
description = "Session-only metadata search across local KeePass vaults"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "vault_cross_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keepass = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.18", features = ["v4"] }
open = "5.3"

[dev-dependencies]
keepass = { version = "0.8", features = ["save_kdbx4"] }
secstr = "0.5"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
